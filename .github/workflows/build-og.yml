name: Build Open Graph preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_og.py'
      - 'assets/profil_fotografi_web.webp'
      - 'assets/selim-monogram.webp'
      - '.github/workflows/build-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Generate 1200x630 preview
        run: python scripts/build_og.py
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate social preview from real portfolio assets"
            git push
          fi
